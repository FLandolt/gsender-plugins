name: Pages

on:
  push:
    branches: [main]
    paths: ["site/**", "plugins/**", "packages/**", "package*.json", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build live demos
        run: |
          for id in hole-pattern cutout surfacing pocket-cutout vcarve; do
            npm run build:demo --workspace "plugins/$id"
            mkdir -p "site/demos/$id"
            cp -r "plugins/$id/ui-demo/." "site/demos/$id/"
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
